services:
  - type: web
    name: eduai
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        value: your_gemini_key_here
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: ADMIN_MASTER_KEY
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        value: AdminEduAI2026!
      - key: ALLOWED_ORIGINS
        value: "*"